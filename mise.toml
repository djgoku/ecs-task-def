[tools]
erlang = "29.0.2"
elixir = "1.20.1-otp-29"
pkl = "0.31.1"
zig = "0.15.2" # required by burrito at release-build time
"conda:xz-tools" = "latest" # required by burrito at release-build time
"conda:xz" = "latest"
"aqua:ip7z/7zip" = "latest"

[tasks.deps]
description = "Fetch Hex dependencies"
run = "mix deps.get"

[tasks.build]
description = "Build both Burrito release binaries for the host OS"
depends = ["deps"]
run = """
set -eu

case "$(uname -s)" in
  Darwin)
    export ECS_TASK_DEF_RELEASE_OS=macos
    export PATH="$PWD/bin:$PATH"
    ;;
  Linux)
    export ECS_TASK_DEF_RELEASE_OS=linux
    ;;
  *)
    echo "build: unsupported host OS: $(uname -s) (expected Darwin or Linux)" >&2
    exit 1
    ;;
esac

MIX_ENV=prod mix release ecs_task_def --overwrite
"""

[tasks.release-smoke]
description = "Smoke-test the host-native Burrito release binary"
run = """
set -eu

case "$(uname -s)" in
  Darwin) release_os=macos ;;
  Linux) release_os=linux ;;
  *)
    echo "release-smoke: unsupported host OS: $(uname -s) (expected Darwin or Linux)" >&2
    exit 1
    ;;
esac

case "$(uname -m)" in
  arm64|aarch64) release_arch=aarch64 ;;
  x86_64|amd64) release_arch=x86_64 ;;
  *)
    echo "release-smoke: unsupported host architecture: $(uname -m)" >&2
    exit 1
    ;;
esac

binary="$PWD/burrito_out/ecs_task_def_${release_os}_${release_arch}"
if [ ! -x "$binary" ]; then
  echo "release-smoke: expected executable $binary; run 'mise run build' first" >&2
  exit 1
fi

tmp_dir="$(mktemp -d "${TMPDIR:-/tmp}/ecs-task-def-release-smoke.XXXXXX")"
trap 'rm -rf "$tmp_dir"' 0

"$binary" --help >/dev/null
"$binary" init "$tmp_dir/project" --vendor >/dev/null

output="$tmp_dir/task.json"
status_file="$tmp_dir/generate.status"
(
  set +e
  ECR_REPO=example.invalid/my-app IMAGE_TAG=smoke \
    "$binary" generate "$tmp_dir/project/mytask.pkl"
  status=$?
  set -e
  printf '%s\\n' "$status" >"$status_file"
) | cat >"$output"

generate_status="$(cat "$status_file")"
if [ "$generate_status" -ne 0 ]; then
  echo "release-smoke: generate exited $generate_status" >&2
  exit "$generate_status"
fi

elixir -e 'path = hd(System.argv()); data = path |> File.read!() |> JSON.decode!(); unless data["family"] == "my-app", do: System.halt(1)' "$output"
echo "release-smoke: passed $binary"
"""

[tasks.release-validate-tag]
description = "Validate the release tag against the Mix and Pkl project versions"
shell = "bash -c"
run = '''
set -euo pipefail

tag="${RELEASE_TAG:-}"
if [ -z "$tag" ]; then
  echo "::error::RELEASE_TAG is required (expected ecs-task-def@X.Y.Z)" >&2
  exit 1
fi

tag_version="${tag#ecs-task-def@}"
if [ "$tag_version" = "$tag" ]; then
  echo "::error::tag '$tag' does not match the required 'ecs-task-def@X.Y.Z' format" >&2
  exit 1
fi

mix_version="$(grep -m1 -E '^[[:space:]]*version:[[:space:]]*"' mix.exs | sed -E 's/.*"([^"]+)".*/\1/' || true)"
pkl_version="$(grep -m1 -E 'version = "' pkl/PklProject | sed -E 's/.*"([^"]+)".*/\1/' || true)"

if [ -z "$mix_version" ] || [ -z "$pkl_version" ]; then
  echo "::error::could not parse version from mix.exs ('$mix_version') or pkl/PklProject ('$pkl_version')" >&2
  exit 1
fi

if [ "$tag_version" != "$mix_version" ] || [ "$tag_version" != "$pkl_version" ]; then
  echo "::error::tag version '$tag_version' must match mix.exs version '$mix_version' and pkl/PklProject version '$pkl_version'" >&2
  exit 1
fi

echo "tag version $tag_version matches mix.exs and pkl/PklProject"
'''

[tasks.release-check-binaries]
description = "Require exactly two Burrito binaries for the host OS"
shell = "bash -c"
run = '''
set -euo pipefail
shopt -s nullglob

case "$(uname -s)" in
  Darwin) release_os=macos ;;
  Linux) release_os=linux ;;
  *)
    echo "::error::unsupported host OS: $(uname -s) (expected Darwin or Linux)" >&2
    exit 1
    ;;
esac

expected=(
  "burrito_out/ecs_task_def_${release_os}_aarch64"
  "burrito_out/ecs_task_def_${release_os}_x86_64"
)
bins=(burrito_out/ecs_task_def_"${release_os}"_*)
if [ "{{ "${" }}#bins[@]}" -ne "{{ "${" }}#expected[@]}" ]; then
  echo "::error::expected exactly ${expected[*]}, found {{ "${" }}#bins[@]}: ${bins[*]:-none}" >&2
  exit 1
fi

for bin in "${expected[@]}"; do
  if [ -L "$bin" ] || [ ! -f "$bin" ] || [ ! -x "$bin" ]; then
    echo "::error::expected non-symlink executable regular file: $bin" >&2
    exit 1
  fi
done

echo "found exact executable aarch64 and x86_64 Burrito binaries for $release_os"
'''

[tasks.release-check-pkl]
description = "Require exactly four Pkl package artifacts"
shell = "bash -c"
run = '''
set -euo pipefail
shopt -s nullglob

pkl_version="$(grep -m1 -E 'version = "' pkl/PklProject | sed -E 's/.*"([^"]+)".*/\1/' || true)"
if [ -z "$pkl_version" ]; then
  echo "::error::could not parse version from pkl/PklProject" >&2
  exit 1
fi

asset_dir="pkl/.out/ecs-task-def@${pkl_version}"
expected=(
  "${asset_dir}/ecs-task-def@${pkl_version}"
  "${asset_dir}/ecs-task-def@${pkl_version}.sha256"
  "${asset_dir}/ecs-task-def@${pkl_version}.zip"
  "${asset_dir}/ecs-task-def@${pkl_version}.zip.sha256"
)
assets=(pkl/.out/*/*)
if [ "{{ "${" }}#assets[@]}" -ne "{{ "${" }}#expected[@]}" ]; then
  echo "::error::expected exactly ${expected[*]}, found {{ "${" }}#assets[@]}: ${assets[*]:-none}" >&2
  exit 1
fi

for asset in "${expected[@]}"; do
  if [ -L "$asset" ] || [ ! -f "$asset" ] || [ ! -r "$asset" ]; then
    echo "::error::expected non-symlink readable regular file: $asset" >&2
    exit 1
  fi
done

echo "found exact readable Pkl package artifacts for version $pkl_version"
'''

[tasks.release-package-pkl]
description = "Package Pkl and require its four release artifacts"
shell = "bash -c"
run = '''
set -euo pipefail

(
  cd pkl
  pkl project package
)

mise run release-check-pkl
'''

[tasks.release-ensure]
description = "Create the GitHub release or confirm a concurrent job created it"
depends = ["release-validate-tag"]
shell = "bash -c"
run = '''
set -euo pipefail

if [ -z "${GH_TOKEN:-}" ]; then
  echo "::error::GH_TOKEN is required to create or inspect the GitHub release" >&2
  exit 1
fi

tag="${RELEASE_TAG:-}"
if ! gh release create "$tag" --verify-tag --title "$tag" \
     --notes "Automated release for $tag."; then
  if ! gh release view "$tag" >/dev/null 2>&1; then
    echo "::error::gh release create failed and no release exists for $tag (not a create-create race)" >&2
    exit 1
  fi
  echo "release $tag already exists (created by a concurrent release job); continuing"
fi
'''

[tasks.release-publish-binaries]
description = "Upload this host OS's two Burrito binaries and SHA-256 sidecars"
depends = ["release-validate-tag", "release-check-binaries"]
shell = "bash -c"
run = '''
set -euo pipefail

if ! command -v shasum >/dev/null 2>&1; then
  echo "::error::shasum is required to generate binary SHA-256 sidecars" >&2
  exit 1
fi

tag="${RELEASE_TAG:-}"
case "$(uname -s)" in
  Darwin) release_os=macos ;;
  Linux) release_os=linux ;;
  *)
    echo "::error::unsupported host OS: $(uname -s) (expected Darwin or Linux)" >&2
    exit 1
    ;;
esac

asset_dir="$(mktemp -d "${TMPDIR:-/tmp}/ecs-task-def-release.XXXXXX")"
trap 'rm -rf "$asset_dir"' EXIT

bins=(
  "burrito_out/ecs_task_def_${release_os}_aarch64"
  "burrito_out/ecs_task_def_${release_os}_x86_64"
)
assets=()
for bin in "${bins[@]}"; do
  name="$(basename "$bin" | sed 's/^ecs_task_def_/ecs-task-def-/')"
  cp "$bin" "$asset_dir/$name"
  (
    cd "$asset_dir"
    shasum -a 256 "$name" > "$name.sha256"
  )
  assets+=("$asset_dir/$name" "$asset_dir/$name.sha256")
done

mise run release-ensure

for asset in "${assets[@]}"; do
  gh release upload "$tag" "$asset" --clobber
done
'''

[tasks.release-publish-pkl]
description = "Upload the four Pkl package artifacts to the GitHub release"
depends = ["release-validate-tag", "release-check-pkl"]
shell = "bash -c"
run = '''
set -euo pipefail

mise run release-ensure

tag="${RELEASE_TAG:-}"
pkl_version="$(grep -m1 -E 'version = "' pkl/PklProject | sed -E 's/.*"([^"]+)".*/\1/' || true)"
asset_dir="pkl/.out/ecs-task-def@${pkl_version}"
assets=(
  "${asset_dir}/ecs-task-def@${pkl_version}"
  "${asset_dir}/ecs-task-def@${pkl_version}.sha256"
  "${asset_dir}/ecs-task-def@${pkl_version}.zip"
  "${asset_dir}/ecs-task-def@${pkl_version}.zip.sha256"
)
for asset in "${assets[@]}"; do
  gh release upload "$tag" "$asset" --clobber
done
'''
