[tools]
claude = { version = "latest", bin = "claude", checksum_expr = '"sha256:" + fromJSON(body).platforms[(os == "macos" ? "darwin" : (os == "windows" ? "win32" : "linux")) + "-" + arch].checksum', checksum_url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/manifest.json", platforms = { windows-x64 = { bin = "claude.exe", url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/win32-x64/claude.exe" } }, url = 'https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/{{ os(macos="darwin") }}-{{ arch() }}/claude', version_list_url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/latest" }
erlang = "29.0.2"
elixir = "1.20.1-otp-29"
pkl = "0.31.1"
zig = "0.15.2" # required by burrito at release-build time
"conda:xz-tools" = "latest" # required by burrito at release-build time
"conda:xz" = "latest"
"aqua:ip7z/7zip" = "latest"

[tasks.deps]
description = "Fetch Hex dependencies"
run = "mix deps.get"

[tasks.build]
description = "Build both Burrito release binaries for the host OS"
depends = ["deps"]
run = """
set -eu

case "$(uname -s)" in
  Darwin)
    export ECS_TASK_DEF_RELEASE_OS=macos
    export PATH="$PWD/bin:$PATH"
    ;;
  Linux)
    export ECS_TASK_DEF_RELEASE_OS=linux
    ;;
  *)
    echo "build: unsupported host OS: $(uname -s) (expected Darwin or Linux)" >&2
    exit 1
    ;;
esac

MIX_ENV=prod mix release ecs_task_def --overwrite
"""
