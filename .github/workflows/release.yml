name: Release

on:
  push:
    tags:
      - "ecs-task-def@*"

permissions:
  contents: write

# Guard against the same tag re-triggering an overlapping run (e.g. a
# force-pushed tag); never cancel a run that may already be uploading assets.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-binaries:
    strategy:
      matrix:
        # macos-15 avoids the Zig 0.15.2/macOS 26 SDK link incompatibility;
        # mise's build task also carries a local macOS 26 compatibility shim.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # install: false + a separate plain `mise install`: mise-action
      # auto-appends --locked whenever mise.lock exists, and the committed
      # lock's conda:xz-tools entry has no per-platform lockfile URL, so
      # strict --locked installation fails (knowledge-base/mise.md). A plain
      # install still honors the lock's pinned versions.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.0
          install: false
      - name: mise install (non-strict; see ci.yml for rationale)
        run: mise install

      - name: Validate tag matches mix.exs and pkl/PklProject versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#ecs-task-def@}"
          if [ "$tag_version" = "$tag" ]; then
            echo "::error::tag '$tag' does not match the required 'ecs-task-def@X.Y.Z' format" >&2
            exit 1
          fi

          mix_version=$(grep -m1 -E '^\s*version:\s*"' mix.exs | sed -E 's/.*"([^"]+)".*/\1/')
          pkl_version=$(grep -m1 -E 'version = "' pkl/PklProject | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$mix_version" ] || [ -z "$pkl_version" ]; then
            echo "::error::could not parse version from mix.exs ('$mix_version') or pkl/PklProject ('$pkl_version')" >&2
            exit 1
          fi

          if [ "$tag_version" != "$mix_version" ] || [ "$tag_version" != "$pkl_version" ]; then
            echo "::error::tag version '$tag_version' must match mix.exs version '$mix_version' and pkl/PklProject version '$pkl_version'" >&2
            exit 1
          fi

          echo "tag version $tag_version matches mix.exs and pkl/PklProject"

      - name: Build releases (this OS's two CPU targets only)
        run: mise run build

      - name: Smoke-test the host-native release binary
        run: mise run release-smoke

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"

          case "${RUNNER_OS}" in
            Linux) release_os=linux ;;
            macOS) release_os=macos ;;
            *)
              echo "::error::unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          bins=(burrito_out/ecs_task_def_"${release_os}"_*)
          if [ "${#bins[@]}" -ne 2 ]; then
            echo "::error::expected exactly 2 built binaries matching burrito_out/ecs_task_def_${release_os}_*, found ${#bins[@]}: ${bins[*]:-none}" >&2
            exit 1
          fi

          # Race-safe create: on a tag push the tag already exists, so a
          # first-time create normally succeeds (adopts the tag). It only
          # fails when the other OS's job already created this same release
          # (gh: "a release with the same tag name already exists", exit 1
          # -- knowledge-base/github-releases.md). Accept that failure ONLY
          # if `gh release view` proves the release now exists; any other
          # failure (auth, network, bad tag) must fail loud.
          if ! gh release create "$tag" --verify-tag --title "$tag" \
               --notes "Automated release for $tag."; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::gh release create failed and no release exists for $tag (not a create-create race)" >&2
              exit 1
            fi
            echo "release $tag already exists (created by the concurrent OS job); continuing"
          fi

          for bin in "${bins[@]}"; do
            name=$(basename "$bin" | sed 's/^ecs_task_def_/ecs-task-def-/')
            cp "$bin" "/tmp/$name"
            gh release upload "$tag" "/tmp/$name" --clobber
          done

  pkl-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.0
          install: false
      - name: mise install (non-strict; see ci.yml for rationale)
        run: mise install

      - name: Validate tag matches mix.exs and pkl/PklProject versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#ecs-task-def@}"
          if [ "$tag_version" = "$tag" ]; then
            echo "::error::tag '$tag' does not match the required 'ecs-task-def@X.Y.Z' format" >&2
            exit 1
          fi

          mix_version=$(grep -m1 -E '^\s*version:\s*"' mix.exs | sed -E 's/.*"([^"]+)".*/\1/')
          pkl_version=$(grep -m1 -E 'version = "' pkl/PklProject | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$mix_version" ] || [ -z "$pkl_version" ]; then
            echo "::error::could not parse version from mix.exs ('$mix_version') or pkl/PklProject ('$pkl_version')" >&2
            exit 1
          fi

          if [ "$tag_version" != "$mix_version" ] || [ "$tag_version" != "$pkl_version" ]; then
            echo "::error::tag version '$tag_version' must match mix.exs version '$mix_version' and pkl/PklProject version '$pkl_version'" >&2
            exit 1
          fi

          echo "tag version $tag_version matches mix.exs and pkl/PklProject"

      - name: Package and upload the Pkl package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"

          (cd pkl && pkl project package)

          assets=(pkl/.out/*/*)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "::error::expected exactly 4 pkl package artifacts (metadata json + zip + their .sha256 sidecars), found ${#assets[@]}: ${assets[*]:-none}" >&2
            exit 1
          fi

          # Race-safe create: see build-binaries job for the full rationale.
          if ! gh release create "$tag" --verify-tag --title "$tag" \
               --notes "Automated release for $tag."; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::gh release create failed and no release exists for $tag (not a create-create race)" >&2
              exit 1
            fi
            echo "release $tag already exists (created by the concurrent binaries job); continuing"
          fi

          for asset in "${assets[@]}"; do
            gh release upload "$tag" "$asset" --clobber
          done
